name: Build HVSS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'hvss2.html'
      - 'android-gas-bridge.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare HVSS v5 PRO with Android sync bridge
        run: |
          rm -rf www
          mkdir -p www
          cp hvss2.html www/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('www/index.html').read_text(encoding='utf-8')
          bridge = Path('android-gas-bridge.js').read_text(encoding='utf-8')
          marker = '</head>'
          injection = '<script>\n' + bridge + '\n</script>\n'
          if marker not in html:
              raise SystemExit('HVSS HTML missing </head> marker')
          html = html.replace(marker, injection + marker, 1)
          Path('www/index.html').write_text(html, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HVSS-Chief-Security-v5-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVSS-Chief-Security-v5-PRO-APK
          path: HVSS-Chief-Security-v5-PRO.apk
          if-no-files-found: error
          retention-days: 30
