name: Build HVSS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'hvss2.html'
      - 'android-gas-bridge.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare HVSS v5 PRO with Android sync fixes
        run: |
          rm -rf www
          mkdir -p www
          cp hvss2.html www/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          html=p.read_text(encoding='utf-8')
          bridge=Path('android-gas-bridge.js').read_text(encoding='utf-8')
          prelude='''<script id="hvss-android-datekey-fix">\nfunction dateKey(v){v=String(v==null?"":v).trim();if(!v)return "";var m=v.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);if(m)return v;m=v.match(/^(?:[^,]+,\\s*)?(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})$/);return m?m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"):v;}\n</script>\n'''
          marker='</head>'
          injection=prelude+'<script>\n'+bridge+'\n</script>\n'
          if marker not in html: raise SystemExit('HVSS HTML missing </head> marker')
          html=html.replace(marker,injection+marker,1)

          # IMPORTANT: keep hvss2.html itself unchanged. The PDF fix is injected only
          # into the Android build artifact. Export PDF must use CENTRAL as source of truth,
          # exactly like the existing Excel export path.
          pdf_patch='''<script id="hvss-pdf-central-export-fix">\n(function(){\n  function install(){\n    if(typeof window.hvssBuildPdf!=="function" || typeof window.HVSS_CENTRAL_PULL!=="function") return false;\n    if(window.__HVSS_PDF_CENTRAL_PATCHED__) return true;\n    var original=window.hvssBuildPdf;\n    window.hvssBuildPdf=async function(mode){\n      try{\n        await window.HVSS_CENTRAL_PULL();\n      }catch(e){\n        alert("Export PDF dibatalkan: gagal mengambil data CENTRAL.\");\n        console.error("HVSS PDF CENTRAL pull failed",e);\n        return;\n      }\n      return original(mode);\n    };\n    window.__HVSS_PDF_CENTRAL_PATCHED__=true;\n    return true;\n  }\n  var timer=setInterval(function(){if(install())clearInterval(timer);},50);\n  setTimeout(function(){clearInterval(timer);install();},15000);\n})();\n</script>\n'''
          body_marker='</body>'
          if body_marker not in html: raise SystemExit('HVSS HTML missing </body> marker')
          html=html.replace(body_marker,pdf_patch+body_marker,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HVSS-Chief-Security-v5-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVSS-Chief-Security-v5-PRO-APK
          path: HVSS-Chief-Security-v5-PRO.apk
          if-no-files-found: error
          retention-days: 30
