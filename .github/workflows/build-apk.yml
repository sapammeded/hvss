name: Build HVSS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'hvss2.html'
      - 'android-gas-bridge.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare HVSS v5 PRO with Android sync fixes
        run: |
          rm -rf www
          mkdir -p www
          cp hvss2.html www/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          html=p.read_text(encoding='utf-8')
          bridge=Path('android-gas-bridge.js').read_text(encoding='utf-8')
          prelude='''<script id="hvss-android-datekey-fix">\nfunction dateKey(v){v=String(v==null?"":v).trim();if(!v)return "";var m=v.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);if(m)return v;m=v.match(/^(?:[^,]+,\\s*)?(\\d{1,2})[-\\/](\\d{1,2})[-\\/](\\d{4})$/);return m?m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"):v;}\n</script>\n'''

          # The Daily Report PDF currently calls the visitor-only PDF mode. Patch only
          # that handler and add a combined report mode. Existing visitor/key/history
          # PDF modes and all other application features remain untouched.
          old='''$("reportPdf").onclick=()=>{renderReport();setTimeout(()=>hvssBuildPdf("visitor"),100)};'''
          new='''$("reportPdf").onclick=async()=>{\n  try{\n    if(window.HVSS_CENTRAL_PULL) await window.HVSS_CENTRAL_PULL();\n    renderReport();\n    setTimeout(()=>hvssBuildPdf("report"),100);\n  }catch(e){\n    alert("Export PDF gagal mengambil CENTRAL: "+(e.message||e));\n  }\n};'''
          if old not in html:
              raise SystemExit('Expected Daily Report PDF handler not found; refusing to build a partial patch')
          html=html.replace(old,new,1)

          marker='''  if(mode==="visitor"){'''
          combined='''  if(mode==="report"){\n    pageHeader("DAILY SECURITY REPORT","Reporting Date: "+dateLabel(r.d));\n    summary(40);\n    doc.autoTable({\n      startY:62,\n      head:[["NO","TIME IN","TIME OUT","NAME","COMPANY","ID CARD","PURPOSE / ACTIVITY","AREA","REMARK","STATUS"]],\n      body:r.v.map((x,i)=>[i+1,x.timeIn||"—",x.timeOut||"—",x.name||"—",x.company||"—",x.idcard||"—",x.purpose||"—",x.area||"—",x.remark||"—",x.timeOut?"OUT":"INSIDE"]),\n      theme:"grid",\n      styles:{font:"helvetica",fontSize:7,cellPadding:2,textColor:[35,45,58],lineColor:LINE,lineWidth:.25,overflow:"linebreak"},\n      headStyles:{fillColor:BLUE,textColor:255,fontStyle:"bold",fontSize:7},\n      alternateRowStyles:{fillColor:[250,251,253]},\n      margin:{left:12,right:12,bottom:17},\n      didDrawPage:footer\n    });\n    let nextY=(doc.lastAutoTable&&doc.lastAutoTable.finalY?doc.lastAutoTable.finalY:62)+9;\n    if(nextY>H-45){doc.addPage();pageHeader("DAILY SECURITY REPORT","Reporting Date: "+dateLabel(r.d));nextY=40;}\n    doc.setTextColor(...NAVY);doc.setFont("helvetica","bold");doc.setFontSize(10);\n    doc.text("KEY CONTROL ACTIVITY",12,nextY);\n    doc.autoTable({\n      startY:nextY+4,\n      head:[["NO","OUT","PEMINJAM","DIVISI","SECURITY","NAMA KUNCI","KEY NO.","IN","PENGEMBALI","STATUS"]],\n      body:r.k.map((x,i)=>[i+1,x.outTime||"—",x.borrower||"—",x.division||"—",x.security||"—",x.keyName||"—",x.keyNumber||"—",x.inTime||"—",x.returner||"—",x.inDate?"RETURNED":"KEY OUT"]),\n      theme:"grid",\n      styles:{font:"helvetica",fontSize:7,cellPadding:2,textColor:[35,45,58],lineColor:LINE,lineWidth:.25,overflow:"linebreak"},\n      headStyles:{fillColor:BLUE,textColor:255,fontStyle:"bold",fontSize:7},\n      alternateRowStyles:{fillColor:[250,251,253]},\n      margin:{left:12,right:12,bottom:17},\n      didDrawPage:footer\n    });\n    doc.save("HVSS_Daily_Report_"+r.d+".pdf");\n    return;\n  }\n\n'''
          if marker not in html:
              raise SystemExit('Expected hvssBuildPdf visitor marker not found; refusing to build a partial patch')
          html=html.replace(marker,combined+marker,1)

          marker='</head>'
          injection=prelude+'<script>\n'+bridge+'\n</script>\n'
          if marker not in html: raise SystemExit('HVSS HTML missing </head> marker')
          html=html.replace(marker,injection+marker,1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HVSS-Chief-Security-v5-PRO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVSS-Chief-Security-v5-PRO-APK
          path: HVSS-Chief-Security-v5-PRO.apk
          if-no-files-found: error
          retention-days: 30
