name: Apply Key Loan Log Patch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hvss2.html
        run: python3 tools/patch_keyloan_log.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hvss2.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Key Loan Log"
          git push
