name: Apply Key Loan Log Patch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hvss2.html
        run: python3 tools/patch_keyloan_log.py
      - name: Commit patched hvss2.html through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/hvss2.html" --jq '.sha')
          CONTENT=$(base64 -w0 hvss2.html)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/hvss2.html" \
            -f message='feat: add Key Loan Log' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main'
